name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Restaurer le debug keystore Android
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_DEBUG_KEYSTORE_BASE64"
          mkdir -p ~/.config/.android
          keystore_tmp="$(mktemp)"
          trap 'rm -f "$keystore_tmp"' EXIT
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$keystore_tmp"
          test -s "$keystore_tmp"
          chmod 600 "$keystore_tmp"
          mv "$keystore_tmp" ~/.config/.android/debug.keystore
          echo "Keystore présent : OK"

      - name: Vérifier le keystore et son alias
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          keystore="$HOME/.config/.android/debug.keystore"
          if [[ ! -s "$keystore" ]]; then
            echo "Keystore présent : FAIL"
            exit 1
          fi
          echo "Keystore présent : OK"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          keystore_list="$(keytool -list \
            -keystore "$HOME/.config/.android/debug.keystore" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD")"
          mapfile -t aliases < <(
            printf '%s\n' "$keystore_list" |
              awk -F, '/PrivateKeyEntry|trustedCertEntry|SecretKeyEntry/ {print $1}'
          )
          if (( ${#aliases[@]} == 0 )); then
            echo "Aucun alias trouvé dans le keystore" >&2
            exit 1
          fi
          printf 'Alias trouvé : %s\n' "${aliases[@]}"
          if ! printf '%s\n' "${aliases[@]}" | grep -Fxq -- "$ANDROID_KEY_ALIAS"; then
            echo "L'alias configuré est absent du keystore" >&2
            exit 1
          fi
          echo "Alias utilisé : OK"

      - name: Générer le rapport de signature SHA Firebase
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          chmod +x gradlew
          signing_report="$(mktemp)"
          trap 'rm -f "$signing_report"' EXIT
          ./gradlew signingReport \
            "-Pandroid.injected.signing.store.file=$HOME/.config/.android/debug.keystore" \
            "-Pandroid.injected.signing.store.password=$ANDROID_KEYSTORE_PASSWORD" \
            "-Pandroid.injected.signing.key.alias=$ANDROID_KEY_ALIAS" \
            "-Pandroid.injected.signing.key.password=$ANDROID_KEY_PASSWORD" \
            > "$signing_report"
          grep -Eq '^SHA1: [0-9A-F]{2}(:[0-9A-F]{2}){19}$' "$signing_report"
          grep -Eq '^SHA-256: [0-9A-F]{2}(:[0-9A-F]{2}){31}$' "$signing_report"
          echo "Génération SHA : OK"

      - name: Compiler l'APK debug
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          ./gradlew assembleDebug \
            "-Pandroid.injected.signing.store.file=$HOME/.config/.android/debug.keystore" \
            "-Pandroid.injected.signing.store.password=$ANDROID_KEYSTORE_PASSWORD" \
            "-Pandroid.injected.signing.key.alias=$ANDROID_KEY_ALIAS" \
            "-Pandroid.injected.signing.key.password=$ANDROID_KEY_PASSWORD"

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: pdf-by-kanto-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
